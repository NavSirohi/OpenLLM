<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="185" viewBox="0 0 1200 185"><defs><linearGradient id="b" x2="1" y2="1"><stop stop-color="#0b1024"/><stop offset="1" stop-color="#15112f"/></linearGradient></defs><rect width="1200" height="185" rx="16" fill="url(#b)"/>
<g font-family="Arial,sans-serif"><g transform="translate(20 18)"><rect width="275" height="149" rx="12" fill="#191934" stroke="#5740a6"/><circle cx="34" cy="34" r="18" fill="#5135aa"/><text x="34" y="41" text-anchor="middle" fill="white" font-size="22">↯</text><text x="17" y="77" fill="white" font-size="18" font-weight="bold">Live by design</text><text x="17" y="102" fill="#afb3ce" font-size="13">Stream answers as they arrive,</text><text x="17" y="121" fill="#afb3ce" font-size="13">not after the waiting is done.</text></g><g transform="translate(315 18)"><rect width="275" height="149" rx="12" fill="#111f32" stroke="#1c7b98"/><circle cx="34" cy="34" r="18" fill="#145d83"/><text x="34" y="40" text-anchor="middle" fill="white" font-size="19">▤</text><text x="17" y="77" fill="white" font-size="18" font-weight="bold">Built to remember</text><text x="17" y="102" fill="#afb3ce" font-size="13">PostgreSQL-backed chats and</text><text x="17" y="121" fill="#afb3ce" font-size="13">reconstructable message parts.</text></g><g transform="translate(610 18)"><rect width="275" height="149" rx="12" fill="#17232a" stroke="#238969"/><circle cx="34" cy="34" r="18" fill="#156b53"/><text x="34" y="41" text-anchor="middle" fill="white" font-size="19">◇</text><text x="17" y="77" fill="white" font-size="18" font-weight="bold">Your space, your chats</text><text x="17" y="102" fill="#afb3ce" font-size="13">Clerk sign-in plus organized</text><text x="17" y="121" fill="#afb3ce" font-size="13">conversation management.</text></g><g transform="translate(905 18)"><rect width="275" height="149" rx="12" fill="#2a182d" stroke="#ab438b"/><circle cx="34" cy="34" r="18" fill="#86346c"/><text x="34" y="41" text-anchor="middle" fill="white" font-size="21">◐</text><text x="17" y="77" fill="white" font-size="18" font-weight="bold">A better everyday UI</text><text x="17" y="102" fill="#afb3ce" font-size="13">Thoughtful sidebar, theming,</text><text x="17" y="121" fill="#afb3ce" font-size="13">and responsive query state.</text></g></g></svg>
